<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Responsive viewport.
      - viewport-fit=cover exposes env(safe-area-inset-*) so notched
        devices (iPhone X and newer) can pad themselves away from the
        rounded corners / home indicator.
      - maximum-scale is intentionally NOT set: pinching to zoom must stay
        available for accessibility.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Standalone / home-screen behaviour on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>PESO-Hub &mdash; Public Employment Service Office Mabini</title>
    <meta
      name="description"
      content="PESO-Hub connects job seekers, employers, and the Public Employment Service Office in one accessible platform."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
